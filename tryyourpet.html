<title>TryYourPet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* TryYourPet Brand Guideline: Cobalt #012fca chủ đạo, Goldenrod #ffc927, Vivid Orange #fa5a2c, Vermilion #e80000, đen, trắng.
   Font: Editorial New Ultra Light (tiêu đề), Neulis Sans (nội dung). Logo, mascot, phụ kiện trong thư mục assets/.
   Layout: hero chia đôi cobalt | goldenrod có mascot, hàng 4 bước, lưới thẻ trắng; checkout = form + cột tóm tắt; quản trị = số liệu + bảng */
@font-face{font-family:"Editorial New";src:url("assets/fonts/editorial-new-ultralight.otf") format("opentype");font-weight:200;font-style:normal;font-display:swap}
@font-face{font-family:"Editorial New";src:url("assets/fonts/editorial-new-ultralight-italic.otf") format("opentype");font-weight:200;font-style:italic;font-display:swap}
@font-face{font-family:"Neulis Sans";src:url("assets/fonts/neulis-sans.otf") format("opentype");font-weight:400;font-style:normal;font-display:swap}
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --sunk:#F1F3FB; --ink:#0B0F1F; --muted:#545B73; --line:#DFE3F2;
  --accent:#012FCA; --accent-ink:#FFFFFF; --accent-soft:#E3E9FF;
  --sun:#FFC927; --sun-soft:#FFF3CC; --sun-ink:#5A4300;
  --orange:#FA5A2C; --orange-soft:#FFE6DE;
  --band:#012FCA; --band-ink:#FFFFFF; --band-soft:rgba(255,255,255,.12);
  --ok:#012FCA; --warn:#C23F12; --warn-soft:#FFE6DE; --bad:#E80000; --bad-soft:#FFE0E0;
  --font-display:"Editorial New",Georgia,"Times New Roman",serif;
  --font-body:"Neulis Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px; --logo-cobalt:block; --logo-white:none; --cobalt:#012FCA;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#070B1C; --surface:#0F1530; --sunk:#161D3D; --ink:#EEF1FF; --muted:#A3ABCC; --line:#262E55;
  --accent:#7B97FF; --accent-ink:#050A22; --accent-soft:#1A2558;
  --sun:#FFC927; --sun-soft:#3A3010; --sun-ink:#FFE08A;
  --orange:#FF7A52; --orange-soft:#3D1C12;
  --band:#0129AE; --band-ink:#FFFFFF; --band-soft:rgba(255,255,255,.12);
  --ok:#7B97FF; --warn:#FF8A5C; --warn-soft:#3D1C12; --bad:#FF5C5C; --bad-soft:#3D1414; --logo-cobalt:none; --logo-white:block; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#070B1C; --surface:#0F1530; --sunk:#161D3D; --ink:#EEF1FF; --muted:#A3ABCC; --line:#262E55;
  --accent:#7B97FF; --accent-ink:#050A22; --accent-soft:#1A2558;
  --sun:#FFC927; --sun-soft:#3A3010; --sun-ink:#FFE08A;
  --orange:#FF7A52; --orange-soft:#3D1C12;
  --band:#0129AE; --band-ink:#FFFFFF; --band-soft:rgba(255,255,255,.12);
  --ok:#7B97FF; --warn:#FF8A5C; --warn-soft:#3D1C12; --bad:#FF5C5C; --bad-soft:#3D1414; --logo-cobalt:none; --logo-white:block; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;font-weight:400;line-height:1.6}
b,strong,th,.btn,legend,.qt{font-weight:600}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--font-display);line-height:1.05;text-wrap:balance;margin:0;font-weight:200;letter-spacing:-.01em}
h1{font-size:clamp(38px,6.2vw,68px)}
h1 em,h2 em,h3 em{font-style:italic;font-weight:200}
h2{font-size:34px}
h3{font-size:26px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.logo{background:none;border:0;padding:4px 0;cursor:pointer;display:flex;align-items:center}
.logo img{height:34px;width:auto}
.logo .on-light{display:var(--logo-cobalt)}
.logo .on-dark{display:var(--logo-white)}
.nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.nav button{background:none;border:0;padding:8px 12px;border-radius:999px;cursor:pointer;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:6px}
.nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
.count{min-width:22px;height:22px;border-radius:999px;background:var(--sun);color:#000;font-size:12px;font-weight:700;display:inline-grid;place-items:center;padding:0 6px}

main{padding-block:28px 64px}
.demo-note{background:var(--sun-soft);color:var(--sun-ink);font-size:13px;padding:8px 12px;border-radius:8px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;border-radius:999px;padding:10px 18px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-ink);text-align:center}
.btn:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--line)}
.btn.small{padding:6px 12px;font-size:13px}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--line)}
.btn.add{background:var(--sun);color:#000}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}

/* hero */
.hero{display:grid;grid-template-columns:1.15fr 1fr;margin-bottom:14px;background:var(--band);color:var(--band-ink);border-radius:28px;overflow:hidden}
.hero-text{padding:clamp(24px,4.5vw,56px);display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:16px}
.hero h1{font-size:clamp(40px,6.4vw,72px);line-height:1}
.hero h1 em{display:block}
.hero p.lead{opacity:.9;font-size:16px;max-width:52ch}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap}
.support-head{display:flex;align-items:center;justify-content:space-between;gap:20px;background:var(--sun);color:#000;border-radius:28px;padding-block:clamp(22px,4vw,44px);padding-inline:clamp(22px,4vw,44px);margin-bottom:20px}
.support-head h1 em{color:var(--cobalt)}
.support-head .lead{font-size:16px;max-width:58ch;margin-top:12px}
.support-mascot{width:190px;max-width:34%;flex:none}
.items{display:grid}
.bank{display:flex;gap:18px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:8px}
.bank img{width:150px;height:150px;border-radius:8px;background:#fff;padding:4px;flex:none}
.bank .review-list{flex:1;min-width:220px}
.acct{font-size:17px;letter-spacing:.04em;font-variant-numeric:tabular-nums}
a{color:var(--accent)}
.item-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:9px;border-bottom:1px solid var(--line);flex-wrap:wrap;font-size:14px}
.item-row:last-child{border-bottom:0}
.qty{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.qty input{width:84px}
.need-block{padding-block:12px;border-bottom:1px solid var(--line);display:grid;gap:6px}
.need-block:last-of-type{border-bottom:0}
button.choice{background:var(--surface);font:inherit}
.choice[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.btn.on-band{color:var(--band-ink);border-color:rgba(255,255,255,.5)}
.hero-art{position:relative;background:var(--sun);min-height:320px}
.hero-art img,.hero-art svg{position:absolute;object-fit:contain;max-width:none}
.hero-art .m1{width:40%;left:6%;bottom:6%}
.hero-art .m2{width:50%;right:3%;bottom:5%}
.hero-art .ball{width:13%;right:9%;top:9%}
.hero-art .bone{width:19%;left:8%;top:11%;transform:rotate(-14deg)}
.hero-art .burst{width:20%;left:42%;top:7%}
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;list-style:none;margin:0 0 26px;padding:0;counter-reset:f}
.flow li{counter-increment:f;background:var(--sunk);border-radius:16px;padding:14px;font-size:13px;color:var(--muted)}
.flow li::before{content:counter(f);display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--sun);color:#000;font-weight:600;margin-bottom:8px}
.flow b{display:block;color:var(--ink);font-size:14px}
.ph{position:absolute;inset:0;display:grid;place-items:center}
.row-pet .mini{position:relative}
.ph img{position:absolute;left:13%;top:8%;width:74%;height:80%;object-fit:contain}
.ph span{position:absolute;right:8px;bottom:6px;font-size:11px;color:#00000080}
.mascot-empty{width:150px;max-width:60%;margin:0 auto 10px;display:block}
/* One orchestrated moment: the two mascots hop into the goldenrod panel on load */
@media (prefers-reduced-motion:no-preference){.hero-art .m1{animation:hop .7s cubic-bezier(.3,1.6,.5,1) .15s both}.hero-art .m2{animation:hop .7s cubic-bezier(.3,1.6,.5,1) .35s both}}
@keyframes hop{from{transform:translateY(40px)}}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:18px}
.seg{display:flex;background:var(--sunk);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:7px 14px;white-space:nowrap;border-radius:999px;cursor:pointer;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
select,input[type=text],input[type=email],input[type=tel],input[type=number],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
.filters .field{min-width:150px;flex:1}
.filters .field:has(.seg){flex:none;min-width:0}
.result-count{margin-left:auto;font-size:13px;color:var(--muted);align-self:center}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
/* Pet cards: no box; the photo carries the shape, text sits on the page */
.card{display:flex;flex-direction:column}
.card .pic{position:relative;aspect-ratio:4/3;background:var(--sunk);cursor:pointer;border:0;padding:0;display:block;width:100%;border-radius:22px;overflow:hidden}
.card h3{font-size:30px}
.vitals{list-style:none;margin:0;padding:0;display:flex;gap:16px;font-size:15px;font-variant-numeric:tabular-nums}
.card .pic svg,.gallery-main svg,.thumb svg{display:block;width:100%;height:100%}
.card .body{padding:14px 2px 0;display:flex;flex-direction:column;gap:6px;flex:1}
.meta{font-size:13px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.tag.yes{background:var(--accent-soft);color:var(--accent)}
.card .actions{display:flex;gap:8px;margin-top:auto;padding-top:4px}
.card .actions .btn{flex:1;white-space:nowrap}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.available{background:var(--accent-soft);color:var(--accent)}
.pill.mine{background:var(--sun);color:#000}
.pill.held{background:var(--warn-soft);color:var(--warn)}
.pill.adopted{background:var(--sunk);color:var(--muted)}
.pill.review{background:var(--warn-soft);color:var(--warn)}
.pill.confirmed{background:var(--accent-soft);color:var(--accent)}
.pill.completed{background:var(--sunk);color:var(--ink)}
.pill.cancelled{background:var(--bad-soft);color:var(--bad)}
.pic .pill{position:absolute;top:10px;left:10px;background:var(--surface)}
.pic .pill.mine{background:var(--sun)}
.empty{padding:40px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}

/* modal */
.modal{position:fixed;inset:0;z-index:20;background:rgba(8,20,16,.55);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto}
.sheet{background:var(--surface);border-radius:16px;max-width:980px;width:100%;display:grid;grid-template-columns:1.1fr 1fr;overflow:hidden;position:relative;max-height:calc(100vh - 32px)}
.sheet .x{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:0;background:var(--surface);cursor:pointer;font-size:20px;z-index:2;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.gallery{background:var(--sunk);padding:12px;display:flex;flex-direction:column;gap:8px}
.gallery-main{aspect-ratio:4/3;border-radius:10px;overflow:hidden;position:relative;background:var(--line)}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.thumb{aspect-ratio:4/3;border-radius:8px;overflow:hidden;border:2px solid transparent;padding:0;cursor:pointer;background:var(--line);position:relative}
.thumb[aria-pressed="true"]{border-color:var(--accent)}
.video-tile{display:grid;place-items:center;height:100%;background:#1c2b27;color:#fff;font-size:12px}
.video-tile .play{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;color:#1c2b27;margin:0 auto 2px}
.video-big{display:grid;place-items:center;height:100%;background:#1c2b27;color:#e8f0ec;text-align:center;padding:20px}
.video-big .play{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.9);color:#1c2b27;display:grid;place-items:center;margin:0 auto 10px;font-size:22px}
.info{padding:22px;overflow:auto;display:flex;flex-direction:column;gap:14px}
dl.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
dl.facts dt{color:var(--muted)}
dl.facts dd{margin:0;font-weight:500}
.story{font-size:14px;color:var(--ink);background:var(--sunk);padding:12px;border-radius:10px}
.section-label{font-size:15px;font-weight:600;color:var(--ink)}

/* home + checkout */
.two{display:grid;grid-template-columns:1fr 340px;gap:24px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.panel+.panel{margin-top:16px}
.row-pet{display:grid;grid-template-columns:96px 1fr auto;gap:14px;align-items:center;padding-block:12px;border-bottom:1px solid var(--line)}
.row-pet:last-child{border-bottom:0}
.row-pet .mini{width:96px;aspect-ratio:4/3;border-radius:8px;overflow:hidden}
.row-pet .mini svg{width:100%;height:100%;display:block}
.hold{font-size:13px;color:var(--sun-ink);background:var(--sun-soft);border-radius:6px;padding:2px 8px;display:inline-block;margin-top:4px;font-variant-numeric:tabular-nums}
.rules{margin:0;padding-left:18px;font-size:14px;color:var(--muted);display:grid;gap:6px}
.stepper{display:flex;gap:6px;list-style:none;padding:0;margin:0 0 18px;flex-wrap:wrap}
.stepper li{flex:1;min-width:120px;font-size:13px;padding:8px 10px;border-radius:8px;background:var(--sunk);color:var(--muted);font-weight:500}
.stepper li[aria-current="step"]{background:var(--accent);color:var(--accent-ink)}
.stepper li.done{background:var(--accent-soft);color:var(--accent)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .full{grid-column:1/-1}
.err{color:var(--bad);font-size:12px;min-height:0}
.hint{color:var(--muted);font-size:12px}
.otp{display:flex;gap:8px;align-items:end;flex-wrap:wrap}
.otp .field{flex:1;min-width:140px}
.verified{color:var(--ok);font-weight:600;font-size:14px}
.q{padding-block:14px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.q:last-child{border-bottom:0}
.q legend,.q .qt{font-weight:600;padding:0}
fieldset.q{border:0;margin:0;border-bottom:1px solid var(--line);padding-inline:0}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px}
.choice:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.choice input{accent-color:var(--accent);margin:0}
.check{display:flex;gap:10px;align-items:flex-start;padding-block:8px;font-size:14px}
.check input{margin-top:4px;accent-color:var(--accent);width:16px;height:16px;flex:none}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.day{border:1px solid var(--line);border-radius:10px;padding:8px;cursor:pointer;background:var(--surface);text-align:center;font-size:13px}
.day b{display:block;font-size:18px;font-family:var(--font-display)}
.day[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.slot{border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;background:var(--surface);text-align:left}
.slot small{display:block;color:var(--muted);font-size:12px}
.slot[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.slot[disabled]{opacity:.45;cursor:not-allowed;text-decoration:line-through}
.nav-steps{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}
.summary .row-pet{grid-template-columns:64px 1fr}
.summary .mini{width:64px}
.callout{border-radius:10px;padding:12px 14px;font-size:14px}
.callout.warn{background:var(--warn-soft);color:var(--warn)}
.callout.ok{background:var(--accent-soft);color:var(--accent)}
.callout.info{background:var(--sunk);color:var(--ink)}
.review-list{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:0}
.review-list dt{color:var(--muted)}
.review-list dd{margin:0;min-width:0;overflow-wrap:anywhere}

/* done */
.done{max-width:640px;margin:0 auto;text-align:center;display:grid;gap:14px}
.code{font-family:ui-monospace,Consolas,monospace;font-size:20px;font-weight:700;letter-spacing:.04em;background:var(--sunk);padding:6px 14px;border-radius:8px;display:inline-block}

/* admin */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-block:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi b{font-family:var(--font-display);font-weight:200;font-size:48px;color:var(--accent);line-height:1;display:block;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--muted)}
.kpi.attn{border-color:var(--orange);background:var(--orange-soft)}
.kpi.attn b{color:var(--warn)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.03em;white-space:nowrap}
td .acts{display:flex;gap:6px;flex-wrap:wrap}
.cal td,.cal th{min-width:110px}
.cal .chip{display:block;font-size:12px;padding:3px 6px;border-radius:6px;margin-bottom:4px}
.chip.confirmed{background:var(--accent-soft);color:var(--accent)}
.chip.review{background:var(--warn-soft);color:var(--warn)}
.chip.free{color:var(--muted)}
.cal td.closed{background:var(--sunk);color:var(--muted);font-size:12px}
.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.admin-grid>.panel{margin-top:0}
.panel h2{font-size:20px;margin-bottom:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.mail{font-size:13px;padding-block:8px;border-bottom:1px solid var(--line)}
.mail:last-child{border-bottom:0}
.mail small{color:var(--muted)}
.cap-row{display:flex;align-items:center;gap:10px;padding-block:6px}
.cap-row input{width:70px}
.daytoggles{display:flex;gap:6px;flex-wrap:wrap}
footer{background:var(--band);color:var(--band-ink);font-size:13px}
footer .btn.ghost{color:var(--band-ink);border-color:rgba(255,255,255,.45)}
footer .wm{height:22px;width:auto;vertical-align:middle;margin-right:6px}
footer .wrap{padding-block:18px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}

}

function mail(to, subject){ S.emails.unshift({ to, subject, at:Date.now() }); }
function releaseOrder(o){ S.holds = S.holds.filter(h => h.orderId !== o.id); }
function sweep(){
  const now = Date.now();
  S.orders.forEach(o => {
    if ((o.status === 'confirmed' || o.status === 'review') && o.apptEnd < now){
      o.status = 'cancelled'; o.cancelReason = 'Không đến đúng hẹn'; releaseOrder(o);
      mail(o.customer.email, 'Đơn '+o.id+' đã bị hủy do không đến đúng hẹn');
    }
  });
  S.holds = S.holds.filter(h => h.until > now);
}
function petState(id){
  if (S.adopted[id]) return 'adopted';
  const h = S.holds.find(h => h.petId === id);
  if (!h) return 'available';
  return h.owner === 'me' && !h.orderId ? 'mine' : 'held';
}

function filtered(){
  const f = S.filters;
  return PETS.filter(p =>
    (f.species === 'all' || p.species === f.species) &&
    (f.breed === 'all' || p.breed === f.breed) &&
    (f.sex === 'all' || p.sex === f.sex) &&
    (f.weight === 'all' || ({ s:p.weight < 5, m:p.weight >= 5 && p.weight < 10, l:p.weight >= 10 && p.weight < 20, xl:p.weight >= 20 })[f.weight])
  ).sort((a,b) => (petState(a.id) === 'adopted') - (petState(b.id) === 'adopted'));
}
function cardActions(p){
  const st = petState(p.id);

  return `<button class="btn small" disabled>${st === 'adopted' ? 'Đã có nhà' : 'Đã được đăng ký'}</button>`;
}

const AMOUNTS = [100000, 200000, 500000, 1000000];
const fmtVND = n => Number(n).toLocaleString('vi-VN')+'đ';
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
function targetLabel(t){
  if (!t || t === 'all') return 'Quỹ chung TryYourPet';
  const [k, v] = t.split(':');
  return k === 'station' ? STATIONS[v].name : 'Bé '+pet(v).name+', '+STATIONS[pet(v).station].name;
}
function targetStation(t){
  if (!t || t === 'all') return null;
  const [k, v] = t.split(':');
  return k === 'station' ? v : pet(v).station;
}
function supportText(x){
  if (x.type === 'cash') return fmtVND(x.amount);
  return ITEMS.filter(([k]) => x.items[k] > 0).map(([k,l,u]) => x.items[k]+' '+u+' '+l.toLowerCase()).join(', ');
}
let supErr = {};
function sinp(id, label, type = 'text', extra = '', full = false){
  return `<label class="field ${full ? 'full' : ''}"><span>${label}</span><input id="s-${id}" type="${type}" data-s="${id}" value="${esc(S.support[id] || '')}" ${extra}><span class="err">${esc(supErr[id] || '')}</span></label>`;
}
function submitSupport(){
  const s = S.support; supErr = {};
  const amount = s.amount === 'custom' ? Math.round(+s.custom || 0) : s.amount;
  if (s.type === 'cash' && !(amount >= 10000)) supErr.amount = 'Số tiền tối thiểu là 10.000đ.';
  if (s.type === 'items' && !ITEMS.some(([k]) => s.items[k] > 0)) supErr.items = 'Nhập số lượng cho ít nhất một món.';
  if (!(s.name || '').trim()) supErr.name = 'Nhập họ tên để trạm ghi nhận.';
  if (!EMAIL_RE.test(s.contact || '')) supErr.contact = 'Nhập email để nhận xác nhận.';
  if (Object.keys(supErr).length) return false;
  const now = new Date(), id = 'HT-'+pad(now.getMonth()+1)+pad(now.getDate())+'-'+String(Math.floor(Math.random()*9000)+1000);
  const rec = { id, type:s.type, target:s.target || 'all', amount:s.type === 'cash' ? amount : null, items:s.type === 'items' ? { ...s.items } : null,
    method:s.type === 'items' ? (s.method || 'dropoff') : null, name:s.name.trim(), anon:!!s.anon, contact:s.contact, phone:s.phone || '', note:s.note || '', status:'pending', createdAt:Date.now() };
  S.supports.unshift(rec);
  mail(s.contact, 'Xác nhận đăng ký hỗ trợ '+id+(s.type === 'cash' ? ' · '+fmtVND(amount) : ''));
  mail('quanly@tryyourpet.vn', 'Hỗ trợ mới '+id+' cho '+targetLabel(rec.target));
  S.lastSupport = id;
  S.support = { type:s.type, target:'all', amount:200000, items:{}, method:'dropoff', name:s.name, contact:s.contact, phone:s.phone };
  return true;
}

function holdLeft(until){
  const ms = until - Date.now(), d = Math.floor(ms / DAY), h = Math.floor((ms % DAY) / 3600e3);
  return `Giữ chỗ đến ${fmtDT(until)}, còn ${d ? d+' ngày ' : ''}${h} giờ`;
}

function cccdAge(c){
  const g = +c[3]; if (g > 3) return null;
  const year = (g < 2 ? 1900 : 2000) + +c.slice(4,6);
  return new Date().getFullYear() - year;
}
function validate(step){
  const d = S.draft; errors = {};
  if (step === 1){
    if (!d.name || d.name.trim().split(/\s+/).length < 2) errors.name = 'Nhập đầy đủ họ và tên.';
    if (!/^0(3|5|7|8|9)\d{8}$/.test((d.phone || '').replace(/[\s.]/g,''))) errors.phone = 'Số điện thoại gồm 10 số, bắt đầu bằng 03, 05, 07, 08 hoặc 09.';
    if (!d.job || !d.job.trim()) errors.job = 'Nhập nghề nghiệp.';
    if (!/^\d{12}$/.test(d.cccd || '')) errors.cccd = 'Số CCCD gồm đúng 12 chữ số.';
    else { const a = cccdAge(d.cccd); if (a === null) errors.cccd = 'Số CCCD không hợp lệ, kiểm tra lại số thứ 4.'; else if (a < 18) errors.cccd = 'Người nhận nuôi cần đủ 18 tuổi.'; }
    if (!d.address || !d.address.trim()) errors.address = 'Nhập địa chỉ.';
    if (!d.district) errors.district = 'Chọn quận / huyện.';
    if (!d.verified) errors.email = 'Xác thực email trước khi tiếp tục.';
  } else if (step === 2){
    questions().forEach(q => { if (!d.answers[q.id]) errors['q-'+q.id] = 'Chọn một câu trả lời.'; });
    if (d.answers.cannot === 'other' && !(d.answers.cannotText || '').trim()) errors['q-cannot'] = 'Mô tả phương án của bạn.';
    if (!(d.answers.care || '').trim()) errors['q-care'] = 'Cho trạm biết ai sẽ chăm bé khi bạn vắng nhà.';
  } else if (step === 3){
    if (!d.date || !d.slot) errors.slot = 'Chọn ngày và khung giờ đón bé.';
    else if (booked(d.method, d.date, d.slot) >= slotById(d.slot).cap) errors.slot = 'Khung giờ này vừa kín, chọn khung khác.';
  } else {
    if (COMMITS.some((_,i) => !d.commits[i])) errors.commits = 'Cần đồng ý tất cả cam kết để gửi đơn.';
  }
  return !Object.keys(errors).length;
}
function evaluate(){
  const a = S.draft.answers, flags = [];
  questions().forEach(q => { if (q.flag && q.flag[a[q.id]]) flags.push(q.flag[a[q.id]]); });
  return flags;
}
function submitOrder(){
  const d = S.draft, flags = evaluate(), slot = slotById(d.slot), now = new Date();
  const id = 'TYP-'+pad(now.getMonth()+1)+pad(now.getDate())+'-'+String(Math.floor(Math.random()*9000)+1000);
  const o = { id, pets:myHolds().map(h => h.petId), status:flags.length ? 'review' : 'confirmed', createdAt:Date.now(), method:d.method, date:d.date, slot:d.slot,
    apptEnd:dparse(d.date).getTime() + (slot.end + 2) * 3600e3, flags,
    customer:{ name:d.name, phone:d.phone, email:d.email, address:d.address, district:d.district, job:d.job }, answers:{...d.answers} };
  S.orders.unshift(o);
  S.holds.forEach(h => { if (h.owner === 'me' && !h.orderId){ h.orderId = id; h.until = o.apptEnd; } });
  mail(d.email, o.status === 'confirmed' ? 'Đơn '+id+' đã được xác nhận, lịch nhận '+fmtDay(d.date)+' '+slot.label : 'Đã nhận đơn '+id+', đang chờ trạm xem lại');
  mail('quanly@tryyourpet.vn', (o.status === 'confirmed' ? 'Đơn mới tự xác nhận ' : 'Đơn mới cần duyệt thủ công ')+id);
  S.lastOrder = id;
  S.draft = { answers:{}, commits:{}, method:'station', name:d.name, phone:d.phone, email:d.email, verified:d.verified, address:d.address, district:d.district, job:d.job, cccd:d.cccd };
  S.step = 1; S.view = 'done';
}

    <div class="scroll"><table><thead><tr><th>Mã</th><th>Người hỗ trợ</th><th>Nội dung</th><th>Dành cho</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody>
    ${S.supports.length ? S.supports.map(x => `<tr>
      <td><b>${x.id}</b>${x.example ? '<br><small class="meta">ví dụ</small>' : ''}</td>
      <td>${esc(x.name)}${x.anon ? ' <small class="meta">(ẩn tên công khai)</small>' : ''}<br><small class="meta">${esc(x.contact)}</small></td>
      <td>${x.type === 'cash' ? 'Hiện kim' : 'Hiện vật'} · ${esc(supportText(x))}${x.method ? `<br><small class="meta">${x.method === 'ship' ? 'Gửi chuyển phát' : 'Mang đến trạm'}</small>` : ''}</td>
      <td>${esc(targetLabel(x.target))}</td>
      <td><span class="pill ${x.status === 'received' ? 'completed' : 'review'}">${x.status === 'received' ? 'Đã nhận' : 'Chờ nhận'}</span></td>
      <td>${x.status === 'pending' ? `<button class="btn small" data-act="supportdone" data-id="${x.id}">${x.type === 'cash' ? 'Đã nhận tiền' : 'Đã nhận đồ'}</button>` : ''}</td></tr>`).join('')
    : `<tr><td colspan="6" class="meta">Chưa có lượt hỗ trợ nào.</td></tr>`}
    </tbody></table></div></section>

  <div class="admin-grid">
    <section class="panel"><h2>Giữ chỗ sắp hết hạn</h2>
      ${expiring.length ? expiring.map(h => `<div class="mail"><b>${esc(pet(h.petId).name)}</b> · ${h.owner === 'me' ? 'khách đang xem demo' : 'khách khác'}<br><small>${holdLeft(h.until)}</small></div>`).join('') : '<p class="meta">Không có bé nào đang được giữ mà chưa gửi đơn.</p>'}
      <p class="hint" style="margin-top:8px">Hệ thống tự nhả bé khi hết ${HOLD_DAYS} ngày, và gửi email nhắc khách trước 24 giờ.</p>
    </section>
    <section class="panel"><h2>Cài đặt lịch nhận</h2>
      <p class="section-label">Ngày mở cửa</p>
      <div class="daytoggles" style="margin:6px 0 12px">${[1,2,3,4,5,6,0].map(x => `<label class="choice"><input type="checkbox" id="od-${x}" data-openday="${x}" ${S.settings.openDays.includes(x) ? 'checked' : ''}>${WEEKDAYS[x]}</label>`).join('')}</div>
      <p class="section-label">Số khách tối đa mỗi khung</p>
      ${[['station','Tại trạm']].map(([m,ml]) => slotsFor(m).map(s => `<label class="cap-row"><input type="number" id="cap-${s.id}" min="0" max="20" data-cap="${s.id}" value="${s.cap}"><span>${ml} · ${s.label}</span></label>`).join('')).join('')}
    </section>
    <section class="panel"><h2>Tình trạng các bé</h2><div class="scroll"><table><thead><tr><th>Bé</th><th>Trạm</th><th>Trạng thái</th></tr></thead><tbody>
      ${PETS.map(p => { const st = petState(p.id); return `<tr><td>${esc(p.name)} <small class="meta">${species(p.species)}</small></td><td>${STATIONS[p.station].name}</td><td><span class="pill ${st}">${STATE_LABEL[st]}</span></td></tr>`; }).join('')}
    </tbody></table></div></section>
    <section class="panel"><h2>Email đã gửi</h2><p class="hint" style="margin-bottom:6px">Mô phỏng, bản thật gửi qua dịch vụ email.</p>
      ${S.emails.slice(0,10).map(e => `<div class="mail"><b>${esc(e.subject)}</b><br><small>${esc(e.to)} · ${fmtDT(e.at)}</small></div>`).join('')}
    </section>
  </div>`;
}

/* ---------- events ---------- */
let toastT;
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2800); }
function closeModal(){ const m = document.getElementById('modal'); m.hidden = true; m.innerHTML = ''; }
function addPet(id){
  if (petState(id) !== 'available') return toast('Bé này hiện không còn trống.');
  if (myHolds().length >= MAX_PETS) return toast('Mỗi đơn nhận tối đa '+MAX_PETS+' bé. Bỏ bớt một bé trong nhà trước.');
  const first = myHolds()[0];
  if (first && pet(first.petId).station !== pet(id).station) return toast('Các bé trong một đơn cần ở cùng một trạm để bạn đón một lần. '+pet(first.petId).name+' đang ở '+STATIONS[pet(first.petId).station].name+'.');
  S.holds.push({ petId:id, owner:'me', until:Date.now() + HOLD_DAYS*DAY });
  toast('Đã thêm '+pet(id).name+' vào nhà. Bé được giữ cho bạn '+HOLD_DAYS+' ngày.');
}
function orderAct(id, fn){ const o = S.orders.find(x => x.id === id); if (o) fn(o); }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el){ if (e.target.id === 'modal') closeModal(); return; }
  const a = el.dataset.act, id = el.dataset.id;
  if (a === 'go'){ S.view = el.dataset.view; if (S.view === 'support') S.lastSupport = null; closeModal(); window.scrollTo(0,0); }
  else if (a === 'supportpet'){ S.support.target = 'pet:'+id; S.lastSupport = null; supErr = {}; S.view = 'support'; closeModal(); window.scrollTo(0,0); }
  else if (a === 'copyacct'){
    const sel = () => { const r = document.createRange(); r.selectNodeContents(document.getElementById('acct')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
    try { navigator.clipboard.writeText(BANK.number).then(() => toast('Đã sao chép số tài khoản'), () => { sel(); toast('Đã chọn số tài khoản, nhấn Ctrl+C để sao chép'); }); }
    catch(err){ sel(); toast('Đã chọn số tài khoản, nhấn Ctrl+C để sao chép'); }
    return;
  }
  else if (a === 'stype'){ S.support.type = el.dataset.v; supErr = {}; }
  else if (a === 'samount'){ S.support.amount = el.dataset.v === 'custom' ? 'custom' : +el.dataset.v; supErr.amount = ''; }
  else if (a === 'supportsubmit'){ if (submitSupport()) window.scrollTo(0,0); }
  else if (a === 'supportagain'){ S.lastSupport = null; supErr = {}; }
  else if (a === 'supportdone'){ const x = S.supports.find(r => r.id === id); if (x){ x.status = 'received'; mail(x.contact, 'Trạm đã nhận hỗ trợ '+x.id+', cảm ơn bạn'); toast('Đã ghi nhận '+x.id); } }
  else if (a === 'filter'){ S.filters[el.dataset.k] = el.dataset.v; if (el.dataset.k === 'species') S.filters.breed = 'all'; }
  else if (a === 'clearfilter'){ S.filters = { species:'all', breed:'all', sex:'all', weight:'all' }; }
  else if (a === 'detail'){ openDetail(id); return; }
  else if (a === 'scrollpets'){ document.getElementById('pets').scrollIntoView({ behavior:'smooth' }); return; }
  else if (a === 'gal'){ gallerySel = +el.dataset.i; renderDetail(id); return; }
  else if (a === 'close'){ closeModal(); return; }
  else if (a === 'add'){ addPet(id); const m = document.getElementById('modal'); if (!m.hidden){ render(); renderDetail(id); return; } }
  else if (a === 'remove'){ S.holds = S.holds.filter(h => !(h.petId === id && h.owner === 'me' && !h.orderId)); toast('Đã bỏ '+pet(id).name+' khỏi nhà, bé được nhả cho người khác.'); }
  else if (a === 'startcheckout'){ S.view = 'checkout'; S.step = 1; errors = {}; window.scrollTo(0,0); }
  else if (a === 'sendotp'){
    const em = S.draft.email || '';
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)){ errors.email = 'Email chưa đúng định dạng.'; }
    else { S.draft.code = String(Math.floor(100000 + Math.random()*900000)); S.draft.otp = ''; errors.email = ''; toast('Đã gửi mã xác thực tới '+em); }
  }
  else if (a === 'verify'){
    if (S.draft.otp === S.draft.code){ S.draft.verified = true; delete S.draft.code; errors.email = ''; toast('Email đã được xác thực.'); }
    else errors.email = 'Mã chưa đúng. Kiểm tra lại email hoặc gửi lại mã.';
  }
  else if (a === 'unverify'){ S.draft.verified = false; }
  else if (a === 'pickday'){ S.draft.date = el.dataset.k; S.draft.slot = null; }
  else if (a === 'pickslot'){ S.draft.slot = el.dataset.k; errors.slot = ''; }
  else if (a === 'back'){ errors = {}; if (S.step === 1) S.view = 'home'; else S.step--; window.scrollTo(0,0); }
  else if (a === 'next'){
    if (!validate(S.step)) { render(); const f = app.querySelector('.err:not(:empty)'); if (f) f.closest('.field,.q,fieldset')?.scrollIntoView({ block:'center' }); return; }
    if (S.step < 4) S.step++; else submitOrder();
    window.scrollTo(0,0);
  }
  else if (a === 'admintab'){ S.adminTab = el.dataset.k; }
  else if (a === 'approve') orderAct(id, o => { o.status = 'confirmed'; mail(o.customer.email, 'Đơn '+o.id+' đã được duyệt'); toast('Đã duyệt đơn '+o.id); });
  else if (a === 'reject') orderAct(id, o => { o.status = 'cancelled'; o.cancelReason = 'Không đạt sàng lọc'; releaseOrder(o); mail(o.customer.email, 'Đơn '+o.id+' chưa được duyệt'); toast('Đã từ chối đơn, bé được nhả.'); });
  else if (a === 'complete') orderAct(id, o => { o.status = 'completed'; o.pets.forEach(p => S.adopted[p] = Date.now()); releaseOrder(o); mail(o.customer.email, 'Cảm ơn bạn đã đón '+o.pets.map(p => pet(p).name).join(', ')+' về nhà'); toast('Đã ghi nhận giao bé thành công.'); });
  else if (a === 'noshow') orderAct(id, o => { o.status = 'cancelled'; o.cancelReason = 'Không đến đúng hẹn'; releaseOrder(o); mail(o.customer.email, 'Đơn '+o.id+' đã bị hủy do không đến đúng hẹn'); toast('Đã hủy đơn và nhả bé.'); });
  else if (a === 'reset'){ S = seed(); errors = {}; closeModal(); toast('Đã đặt lại dữ liệu demo.'); }
  render();
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.f){ S.draft[t.dataset.f] = t.value; if (t.dataset.f === 'district') render(); else save(); }
  else if (t.dataset.qt){ S.draft.answers[t.dataset.qt] = t.value; save(); }
  else if (t.dataset.s){ S.support[t.dataset.s] = t.type === 'checkbox' ? t.checked : t.value; save(); }
  else if (t.dataset.item){ S.support.items[t.dataset.item] = Math.max(0, Math.floor(+t.value) || 0); save(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.filter){ S.filters[t.dataset.filter] = t.value; render(); }
  else if (t.dataset.q){ S.draft.answers[t.dataset.q] = t.value; render(); }
  else if (t.dataset.method){ S.draft.method = t.dataset.method; S.draft.slot = null; render(); }
  else if (t.dataset.c !== undefined){ S.draft.commits[t.dataset.c] = t.checked; save(); }
  else if (t.dataset.openday !== undefined){ const x = +t.dataset.openday; S.settings.openDays = t.checked ? [...S.settings.openDays, x] : S.settings.openDays.filter(d => d !== x); render(); }
  else if (t.dataset.cap){ const s = slotById(t.dataset.cap); s.cap = Math.max(0, Math.min(20, +t.value || 0)); render(); }
  else if (t.dataset.s === 'target' || t.dataset.s === 'method'){ S.support[t.dataset.s] = t.value; render(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !document.getElementById('modal').hidden) closeModal(); });
render();
</script>
