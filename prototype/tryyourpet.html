<title>TryYourPet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* TryYourPet Brand Guideline: Cobalt #012fca chủ đạo, Goldenrod #ffc927, Vivid Orange #fa5a2c, Vermilion #e80000, đen, trắng.
   Font: Editorial New Ultra Light (tiêu đề), Neulis Sans (nội dung). Logo, mascot, phụ kiện trong thư mục assets/.
   Layout: hero chia đôi cobalt | goldenrod có mascot, hàng 4 bước, lưới thẻ trắng; checkout = form + cột tóm tắt; quản trị = số liệu + bảng */
@font-face{font-family:"Editorial New";src:url("assets/fonts/editorial-new-ultralight.otf") format("opentype");font-weight:200;font-style:normal;font-display:swap}
@font-face{font-family:"Editorial New";src:url("assets/fonts/editorial-new-ultralight-italic.otf") format("opentype");font-weight:200;font-style:italic;font-display:swap}
@font-face{font-family:"Neulis Sans";src:url("assets/fonts/neulis-sans.otf") format("opentype");font-weight:400;font-style:normal;font-display:swap}
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --sunk:#F1F3FB; --ink:#0B0F1F; --muted:#545B73; --line:#DFE3F2;
  --accent:#012FCA; --accent-ink:#FFFFFF; --accent-soft:#E3E9FF;
  --sun:#FFC927; --sun-soft:#FFF3CC; --sun-ink:#5A4300;
  --orange:#FA5A2C; --orange-soft:#FFE6DE;
  --band:#012FCA; --band-ink:#FFFFFF; --band-soft:rgba(255,255,255,.12);
  --ok:#012FCA; --warn:#C23F12; --warn-soft:#FFE6DE; --bad:#E80000; --bad-soft:#FFE0E0;
  --font-display:"Editorial New",Georgia,"Times New Roman",serif;
  --font-body:"Neulis Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px; --logo-cobalt:block; --logo-white:none; --cobalt:#012FCA;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#070B1C; --surface:#0F1530; --sunk:#161D3D; --ink:#EEF1FF; --muted:#A3ABCC; --line:#262E55;
  --accent:#7B97FF; --accent-ink:#050A22; --accent-soft:#1A2558;
  --sun:#FFC927; --sun-soft:#3A3010; --sun-ink:#FFE08A;
  --orange:#FF7A52; --orange-soft:#3D1C12;
  --band:#0129AE; --band-ink:#FFFFFF; --band-soft:rgba(255,255,255,.12);
  --ok:#7B97FF; --warn:#FF8A5C; --warn-soft:#3D1C12; --bad:#FF5C5C; --bad-soft:#3D1414; --logo-cobalt:none; --logo-white:block; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#070B1C; --surface:#0F1530; --sunk:#161D3D; --ink:#EEF1FF; --muted:#A3ABCC; --line:#262E55;
  --accent:#7B97FF; --accent-ink:#050A22; --accent-soft:#1A2558;
  --sun:#FFC927; --sun-soft:#3A3010; --sun-ink:#FFE08A;
  --orange:#FF7A52; --orange-soft:#3D1C12;
  --band:#0129AE; --band-ink:#FFFFFF; --band-soft:rgba(255,255,255,.12);
  --ok:#7B97FF; --warn:#FF8A5C; --warn-soft:#3D1C12; --bad:#FF5C5C; --bad-soft:#3D1414; --logo-cobalt:none; --logo-white:block; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;font-weight:400;line-height:1.6}
b,strong,th,.btn,legend,.qt{font-weight:600}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--font-display);line-height:1.05;text-wrap:balance;margin:0;font-weight:200;letter-spacing:-.01em}
h1{font-size:clamp(38px,6.2vw,68px)}
h1 em,h2 em,h3 em{font-style:italic;font-weight:200}
h2{font-size:34px}
h3{font-size:26px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.logo{background:none;border:0;padding:4px 0;cursor:pointer;display:flex;align-items:center}
.logo img{height:34px;width:auto}
.logo .on-light{display:var(--logo-cobalt)}
.logo .on-dark{display:var(--logo-white)}
.nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.nav button{background:none;border:0;padding:8px 12px;border-radius:999px;cursor:pointer;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:6px}
.nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
.count{min-width:22px;height:22px;border-radius:999px;background:var(--sun);color:#000;font-size:12px;font-weight:700;display:inline-grid;place-items:center;padding:0 6px}

main{padding-block:28px 64px}
.demo-note{background:var(--sun-soft);color:var(--sun-ink);font-size:13px;padding:8px 12px;border-radius:8px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;border-radius:999px;padding:10px 18px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-ink);text-align:center}
.btn:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--line)}
.btn.small{padding:6px 12px;font-size:13px}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--line)}
.btn.add{background:var(--sun);color:#000}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}

/* hero */
.hero{display:grid;grid-template-columns:1.15fr 1fr;margin-bottom:14px;background:var(--band);color:var(--band-ink);border-radius:28px;overflow:hidden}
.hero-text{padding:clamp(24px,4.5vw,56px);display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:16px}
.hero h1{font-size:clamp(40px,6.4vw,72px);line-height:1}
.hero h1 em{display:block}
.hero p.lead{opacity:.9;font-size:16px;max-width:52ch}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap}
a{color:var(--accent)}
.btn.on-band{color:var(--band-ink);border-color:rgba(255,255,255,.5)}
.hero-art{position:relative;background:var(--sun);min-height:320px}
.hero-art img,.hero-art svg{position:absolute;object-fit:contain;max-width:none}
.hero-art .m1{width:40%;left:6%;bottom:6%}
.hero-art .m2{width:50%;right:3%;bottom:5%}
.hero-art .ball{width:13%;right:9%;top:9%}
.hero-art .bone{width:19%;left:8%;top:11%;transform:rotate(-14deg)}
.hero-art .burst{width:20%;left:42%;top:7%}
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;list-style:none;margin:0 0 26px;padding:0;counter-reset:f}
.flow li{counter-increment:f;background:var(--sunk);border-radius:16px;padding:14px;font-size:13px;color:var(--muted)}
.flow li::before{content:counter(f);display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--sun);color:#000;font-weight:600;margin-bottom:8px}
.flow b{display:block;color:var(--ink);font-size:14px}
.ph{position:absolute;inset:0;display:grid;place-items:center}
.row-pet .mini{position:relative}
.ph img{position:absolute;left:13%;top:8%;width:74%;height:80%;object-fit:contain}
.ph span{position:absolute;right:8px;bottom:6px;font-size:11px;color:#00000080}
.mascot-empty{width:150px;max-width:60%;margin:0 auto 10px;display:block}
/* One orchestrated moment: the two mascots hop into the goldenrod panel on load */
@media (prefers-reduced-motion:no-preference){.hero-art .m1{animation:hop .7s cubic-bezier(.3,1.6,.5,1) .15s both}.hero-art .m2{animation:hop .7s cubic-bezier(.3,1.6,.5,1) .35s both}}
@keyframes hop{from{transform:translateY(40px)}}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:18px}
.seg{display:flex;background:var(--sunk);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:7px 14px;white-space:nowrap;border-radius:999px;cursor:pointer;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
select,input[type=text],input[type=email],input[type=tel],input[type=number],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
.filters .field{min-width:150px;flex:1}
.filters .field:has(.seg){flex:none;min-width:0}
.result-count{margin-left:auto;font-size:13px;color:var(--muted);align-self:center}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
/* Pet cards: no box; the photo carries the shape, text sits on the page */
.card{display:flex;flex-direction:column}
.card .pic{position:relative;aspect-ratio:4/3;background:var(--sunk);cursor:pointer;border:0;padding:0;display:block;width:100%;border-radius:22px;overflow:hidden}
.card h3{font-size:30px}
.vitals{list-style:none;margin:0;padding:0;display:flex;gap:16px;font-size:15px;font-variant-numeric:tabular-nums}
.card .pic svg,.gallery-main svg,.thumb svg{display:block;width:100%;height:100%}
.card .body{padding:14px 2px 0;display:flex;flex-direction:column;gap:6px;flex:1}
.meta{font-size:13px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.tag.yes{background:var(--accent-soft);color:var(--accent)}
.card .actions{display:flex;gap:8px;margin-top:auto;padding-top:4px}
.card .actions .btn{flex:1;white-space:nowrap}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.available{background:var(--accent-soft);color:var(--accent)}
.pill.mine{background:var(--sun);color:#000}
.pill.held{background:var(--warn-soft);color:var(--warn)}
.pill.adopted{background:var(--sunk);color:var(--muted)}
.pill.review{background:var(--warn-soft);color:var(--warn)}
.pill.confirmed{background:var(--accent-soft);color:var(--accent)}
.pill.completed{background:var(--sunk);color:var(--ink)}
.pill.cancelled{background:var(--bad-soft);color:var(--bad)}
.pic .pill{position:absolute;top:10px;left:10px;background:var(--surface)}
.pic .pill.mine{background:var(--sun)}
.empty{padding:40px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}

/* modal */
.modal{position:fixed;inset:0;z-index:20;background:rgba(8,20,16,.55);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto}
.sheet{background:var(--surface);border-radius:16px;max-width:980px;width:100%;display:grid;grid-template-columns:1.1fr 1fr;overflow:hidden;position:relative;max-height:calc(100vh - 32px)}
.sheet .x{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:0;background:var(--surface);cursor:pointer;font-size:20px;z-index:2;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.gallery{background:var(--sunk);padding:12px;display:flex;flex-direction:column;gap:8px}
.gallery-main{aspect-ratio:4/3;border-radius:10px;overflow:hidden;position:relative;background:var(--line)}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.thumb{aspect-ratio:4/3;border-radius:8px;overflow:hidden;border:2px solid transparent;padding:0;cursor:pointer;background:var(--line);position:relative}
.thumb[aria-pressed="true"]{border-color:var(--accent)}
.video-tile{display:grid;place-items:center;height:100%;background:#1c2b27;color:#fff;font-size:12px}
.video-tile .play{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;color:#1c2b27;margin:0 auto 2px}
.video-big{display:grid;place-items:center;height:100%;background:#1c2b27;color:#e8f0ec;text-align:center;padding:20px}
.video-big .play{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.9);color:#1c2b27;display:grid;place-items:center;margin:0 auto 10px;font-size:22px}
.info{padding:22px;overflow:auto;display:flex;flex-direction:column;gap:14px}
dl.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
dl.facts dt{color:var(--muted)}
dl.facts dd{margin:0;font-weight:500}
.story{font-size:14px;color:var(--ink);background:var(--sunk);padding:12px;border-radius:10px}
.section-label{font-size:15px;font-weight:600;color:var(--ink)}

/* home + checkout */
.two{display:grid;grid-template-columns:1fr 340px;gap:24px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.panel+.panel{margin-top:16px}
.row-pet{display:grid;grid-template-columns:96px 1fr auto;gap:14px;align-items:center;padding-block:12px;border-bottom:1px solid var(--line)}
.row-pet:last-child{border-bottom:0}
.row-pet .mini{width:96px;aspect-ratio:4/3;border-radius:8px;overflow:hidden}
.row-pet .mini svg{width:100%;height:100%;display:block}
.hold{font-size:13px;color:var(--sun-ink);background:var(--sun-soft);border-radius:6px;padding:2px 8px;display:inline-block;margin-top:4px;font-variant-numeric:tabular-nums}
.rules{margin:0;padding-left:18px;font-size:14px;color:var(--muted);display:grid;gap:6px}
.stepper{display:flex;gap:6px;list-style:none;padding:0;margin:0 0 18px;flex-wrap:wrap}
.stepper li{flex:1;min-width:120px;font-size:13px;padding:8px 10px;border-radius:8px;background:var(--sunk);color:var(--muted);font-weight:500}
.stepper li[aria-current="step"]{background:var(--accent);color:var(--accent-ink)}
.stepper li.done{background:var(--accent-soft);color:var(--accent)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .full{grid-column:1/-1}
.err{color:var(--bad);font-size:12px;min-height:0}
.hint{color:var(--muted);font-size:12px}
.otp{display:flex;gap:8px;align-items:end;flex-wrap:wrap}
.otp .field{flex:1;min-width:140px}
.verified{color:var(--ok);font-weight:600;font-size:14px}
.q{padding-block:14px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.q:last-child{border-bottom:0}
.q legend,.q .qt{font-weight:600;padding:0}
fieldset.q{border:0;margin:0;border-bottom:1px solid var(--line);padding-inline:0}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px}
.choice:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.choice input{accent-color:var(--accent);margin:0}
.check{display:flex;gap:10px;align-items:flex-start;padding-block:8px;font-size:14px}
.check input{margin-top:4px;accent-color:var(--accent);width:16px;height:16px;flex:none}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.day{border:1px solid var(--line);border-radius:10px;padding:8px;cursor:pointer;background:var(--surface);text-align:center;font-size:13px}
.day b{display:block;font-size:18px;font-family:var(--font-display)}
.day[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.slot{border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;background:var(--surface);text-align:left}
.slot small{display:block;color:var(--muted);font-size:12px}
.slot[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.slot[disabled]{opacity:.45;cursor:not-allowed;text-decoration:line-through}
.nav-steps{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}
.summary .row-pet{grid-template-columns:64px 1fr}
.summary .mini{width:64px}
.callout{border-radius:10px;padding:12px 14px;font-size:14px}
.callout.warn{background:var(--warn-soft);color:var(--warn)}
.callout.ok{background:var(--accent-soft);color:var(--accent)}
.callout.info{background:var(--sunk);color:var(--ink)}
.review-list{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:0}
.review-list dt{color:var(--muted)}
.review-list dd{margin:0;min-width:0;overflow-wrap:anywhere}

/* done */
.done{max-width:640px;margin:0 auto;text-align:center;display:grid;gap:14px}
.code{font-family:ui-monospace,Consolas,monospace;font-size:20px;font-weight:700;letter-spacing:.04em;background:var(--sunk);padding:6px 14px;border-radius:8px;display:inline-block}

/* admin */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-block:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi b{font-family:var(--font-display);font-weight:200;font-size:48px;color:var(--accent);line-height:1;display:block;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--muted)}
.kpi.attn{border-color:var(--orange);background:var(--orange-soft)}
.kpi.attn b{color:var(--warn)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.03em;white-space:nowrap}
td .acts{display:flex;gap:6px;flex-wrap:wrap}
.cal td,.cal th{min-width:110px}
.cal .chip{display:block;font-size:12px;padding:3px 6px;border-radius:6px;margin-bottom:4px}
.chip.confirmed{background:var(--accent-soft);color:var(--accent)}
.chip.review{background:var(--warn-soft);color:var(--warn)}
.chip.free{color:var(--muted)}
.cal td.closed{background:var(--sunk);color:var(--muted);font-size:12px}
.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.admin-grid>.panel{margin-top:0}
.panel h2{font-size:20px;margin-bottom:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.mail{font-size:13px;padding-block:8px;border-bottom:1px solid var(--line)}
.mail:last-child{border-bottom:0}
.mail small{color:var(--muted)}
.cap-row{display:flex;align-items:center;gap:10px;padding-block:6px}
.cap-row input{width:70px}
.daytoggles{display:flex;gap:6px;flex-wrap:wrap}
footer{background:var(--band);color:var(--band-ink);font-size:13px}
footer .btn.ghost{color:var(--band-ink);border-color:rgba(255,255,255,.45)}
footer .wm{height:22px;width:auto;vertical-align:middle;margin-right:6px}
footer .wrap{padding-block:18px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:30;max-width:calc(100% - 32px);text-align:center}

@media (max-width:860px){
  .hero,.two,.sheet,.admin-grid{grid-template-columns:1fr}
  .hero-art{min-height:240px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .sheet{max-height:none}
}
@media (max-width:560px){
  .hero{border-radius:22px}
  .flow{grid-template-columns:1fr 1fr}
  .nav{margin-left:0;width:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .nav button{flex:none;padding:7px 10px}
  .form-grid{grid-template-columns:1fr}
  .row-pet{grid-template-columns:72px 1fr}
  .row-pet .mini{width:72px}
  .row-pet>.btn{grid-column:2;justify-self:start}
  .result-count{margin-left:0}
}
.flow.three{grid-template-columns:repeat(3,1fr)}
.contact{display:grid;gap:12px;background:var(--sunk);border-radius:14px;padding:16px;font-size:14px}
.contact-actions{display:flex;flex-wrap:wrap;gap:8px}
.contact .phone{font-variant-numeric:tabular-nums;white-space:nowrap}
.contact-panel{margin-top:28px}
.contact-panel .contact{background:none;padding:0}
.note{background:var(--sun-soft);color:var(--sun-ink);font-size:13px;padding:8px 12px;border-radius:8px}
.kpis.two-kpis{grid-template-columns:repeat(2,1fr)}

};

const STATIONS = {
  VML: { name: 'Vườn Mèo Lang Thang', area: 'TP.HCM', addr: 'địa chỉ đón bé cập nhật sau', fb: 'https://www.facebook.com/vuonmeolangthang/', email: 'vuonmeolangthangoffical@gmail.com' },
  PN: { name: 'Purr Nature', area: 'TP.HCM', addr: 'địa chỉ đón bé cập nhật sau', fb: 'https://www.facebook.com/purr.nature.store', email: 'purr.nature@gmail.com' },

};
const fbLink = st => st.fb ? `<br><a href="${st.fb}" target="_blank" rel="noopener">Trang Facebook của trạm</a>` : '';

const PETS = [
  { id:'P01', name:'Mướp', species:'cat', breed:'Mèo ta', sex:'Cái', age:8, weight:3.2, vaccine:'Đã tiêm 2 mũi (4 bệnh) + dại', neutered:true, traits:['Hiền','Thích được vuốt ve','Sống tốt với mèo khác'], story:'Được tìm thấy trong thùng carton ở một con hẻm Bình Thạnh tháng 3/2026, lúc khoảng 1 tháng tuổi và bị ve rận nặng. Sau 2 tháng chăm sóc, bé đã khoẻ và rất bám người.', station:'VML', fur:'#C98B4A', ear:'#A86E35', bg:'#F6E3C8', video:'0:42' },
  { id:'P02', name:'Lu', species:'dog', breed:'Chó ta', sex:'Đực', age:24, weight:14, vaccine:'Đã tiêm 7 bệnh + dại', neutered:true, traits:['Trung thành','Năng động','Cần đi dạo mỗi ngày'], story:'Lu bị bỏ lại ở bãi đất trống Gò Vấp sau khi chủ chuyển nhà. Bé bị gãy chân sau, đã phẫu thuật và hồi phục hoàn toàn. Đi dây dắt rất ngoan.', station:'TD', fur:'#B9814E', ear:'#8E5E33', bg:'#E6EFD9', video:'1:05' },
  { id:'P03', name:'Bông', species:'dog', breed:'Poodle', sex:'Cái', age:36, weight:4.5, vaccine:'Đã tiêm 7 bệnh + dại', neutered:true, traits:['Điềm tĩnh','Hợp chung cư','Hơi nhát người lạ'], story:'Được giải cứu từ một trại nhân giống chui ở Bình Chánh cùng 9 bé khác. Bông cần chủ kiên nhẫn trong 1–2 tuần đầu để làm quen.', station:'TD', fur:'#EFE6DA', ear:'#D9CBB8', bg:'#DDE8F0', video:'0:38' },
  { id:'P04', name:'Mực', species:'dog', breed:'Chó ta', sex:'Đực', age:10, weight:9, vaccine:'Đã tiêm 5 bệnh, chờ mũi dại', neutered:false, traits:['Ham chơi','Thông minh','Thích trẻ em'], story:'Mực được người dân phát hiện mắc kẹt dưới cống thoát nước Quận 8 sau trận mưa lớn. Bé khoẻ mạnh, đang học đi vệ sinh đúng chỗ.', station:'TD', fur:'#2F2A28', ear:'#1E1A19', bg:'#F2E2D9', video:'0:51' },
  { id:'P05', name:'Kem', species:'cat', breed:'Mèo Anh lông ngắn lai', sex:'Đực', age:18, weight:5.1, vaccine:'Đã tiêm 4 bệnh + dại', neutered:true, traits:['Lười biếng','Thích ngủ','Không thích bị bế lâu'], story:'Kem bị chủ cũ bỏ lại trong phòng trọ khi về quê. Hàng xóm báo trạm sau 3 ngày bé không có ai cho ăn.', station:'PN', fur:'#9AA4AD', ear:'#7F8992', bg:'#F3E9D2', video:'0:33' },

  { id:'P07', name:'Tam Thể', species:'cat', breed:'Mèo ta', sex:'Cái', age:14, weight:3.6, vaccine:'Đã tiêm 4 bệnh + dại', neutered:true, traits:['Độc lập','Thích leo trèo','Bắt chuột giỏi'], story:'Mẹ của một đàn 4 mèo con được cứu ở chợ Bà Chiểu. Các con đã có nhà, giờ đến lượt mẹ.', station:'VML', fur:'#E2A25E', ear:'#3A302B', bg:'#E5EDE4', video:'0:47' },
  { id:'P08', name:'Mochi', species:'cat', breed:'Mèo Ba Tư lai', sex:'Cái', age:48, weight:4.2, vaccine:'Đã tiêm 4 bệnh + dại', neutered:true, traits:['Dịu dàng','Cần chải lông hằng ngày','Hợp người ở nhà nhiều'], story:'Mochi bị viêm da nặng khi được đưa về trạm từ Tân Phú. Đã điều trị khỏi, lông mọc lại đẹp nhưng cần được chải và tắm định kỳ.', station:'PN', fur:'#F3EEE7', ear:'#DCCFC0', bg:'#E9E1F0', video:'0:40' },
  { id:'P09', name:'Cún Vàng', species:'dog', breed:'Chó ta lai Phốc', sex:'Cái', age:6, weight:3.8, vaccine:'Đã tiêm 5 bệnh', neutered:false, traits:['Nhỏ nhắn','Lanh lợi','Hay sủa khi lạ chỗ'], story:'Được nhặt ở công viên Gia Định lúc 2 tháng tuổi. Bé sẽ được trạm hỗ trợ chi phí triệt sản khi đủ 6–8 tháng.', station:'TD', fur:'#E0B062', ear:'#C38F3F', bg:'#DCEAF0', video:'0:29' },
  { id:'P10', name:'Đen', species:'cat', breed:'Mèo ta', sex:'Đực', age:20, weight:4.8, vaccine:'Đã tiêm 4 bệnh + dại', neutered:true, traits:['Tình cảm','Hay nói chuyện','Thích ngồi cửa sổ'], story:'Đen hay bị xua đuổi vì bộ lông đen. Bé được cứu khi bị thương ở chân trước tại Phú Nhuận, nay đã lành.', station:'VML', fur:'#26252A', ear:'#141317', bg:'#F4E7CF', video:'0:36' },
  { id:'P11', name:'Pi', species:'dog', breed:'Pug', sex:'Đực', age:60, weight:8.5, vaccine:'Đã tiêm 7 bệnh + dại', neutered:true, traits:['Hiền','Ít vận động','Ngáy to'], story:'Pi bị bỏ rơi trước cổng trạm Thủ Đức. Bé có vấn đề hô hấp nhẹ, cần tránh nóng.', station:'TD', fur:'#D9B98C', ear:'#3A2E26', bg:'#E8E1D5', video:'0:44' },
  { id:'P12', name:'Sữa', species:'cat', breed:'Mèo ta', sex:'Cái', age:11, weight:3.0, vaccine:'Đã tiêm 4 bệnh + dại', neutered:true, traits:['Nghịch ngợm','Thích đồ chơi','Hợp trẻ em'], story:'Sữa được cứu cùng 2 anh em ở Quận 4. Bé rất quấn người và thích chơi cần câu mèo.', station:'VML', fur:'#F7F3EC', ear:'#E4B9A8', bg:'#DDEBE4', video:'0:31' }
];

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pet = id => PETS.find(p => p.id === id);
const ageText = m => m < 12 ? m+' tháng' : (m % 12 ? (m/12).toFixed(1).replace('.',',')+' tuổi' : (m/12)+' tuổi');
const kg = w => String(w).replace('.',',')+' kg';
const species = s => s === 'cat' ? 'Mèo' : 'Chó';

/* Demo state: only filters and which pets are marked adopted, kept in this browser. */
function seed(){ return { v:5, view:'list', filters:{ species:'all', breed:'all', sex:'all', weight:'all' }, adopted:{ P11:true } }; }
let S;
try { S = JSON.parse(localStorage.getItem(LS)); } catch(e) { S = null; }
if (!S || S.v !== 5) S = seed();
function save(){ try { localStorage.setItem(LS, JSON.stringify(S)); } catch(e) {} }
const petState = id => S.adopted[id] ? 'adopted' : 'available';
const STATE_LABEL = { available:'Đang tìm nhà', adopted:'Đã có nhà' };

/* Mascot placeholder; the real site swaps these for the station's photos */
const BRAND_BG = ['#FFE7A3','#D6DFFF','#FFD6C8'];
const POSES = {
  dog:['dog-sit','dog-run','dog-stand','dog-spin','dog-stick','dog-surprised','dog-roll','dog-grumpy'],
  cat:['cat-sit','cat-walk','cat-stand','cat-sleep','cat-crouch','cat-roll','cat-sad']
};
function art(p, v = 0){
  const i = PETS.indexOf(p), poses = POSES[p.species];
  return `<div class="ph" style="background:${BRAND_BG[(i + v) % 3]}"><img src="assets/${poses[(i + v) % poses.length]}.png" alt="Ảnh minh họa ${esc(p.name)}" loading="lazy"><span>Ảnh minh họa ${v+1}/3</span></div>`;
}

/** Ways to adopt: message one of the fanpages, or call the project manager. */
function contactBlock(p){
  const ph = CONTACT.phone;
  return `<div class="contact">
    ${p ? `<p>Muốn đón <b>${esc(p.name)}</b> về nhà? Nhắn tin cho một trong hai fanpage hoặc gọi điện, nhớ nói tên bé để trạm hỗ trợ nhanh hơn.</p>`
        : '<p>Chọn bé bạn thương, rồi nhắn tin cho một trong hai fanpage hoặc gọi điện. Nhớ nói tên bé để trạm hỗ trợ nhanh hơn.</p>'}
    <div class="contact-actions">
      ${CONTACT.fanpages.map(f => `<a class="btn" href="${f.messenger}" target="_blank" rel="noopener">Inbox ${esc(f.name)}</a>`).join('')}
      <a class="btn add" href="tel:${ph.number}">Gọi ${ph.display}</a>
    </div>
    <p class="hint">${CONTACT.fanpages.map(f => `<a href="${f.page}" target="_blank" rel="noopener">Fanpage ${esc(f.name)}</a>`).join(', ')}. Số điện thoại: ${ph.role} ${esc(ph.name)}, <b class="phone">${ph.display}</b>.</p>
  </div>`;
}

/* ---------- views ---------- */
const app = document.getElementById('app');
function renderNav(){
  const v = S.view;
  document.getElementById('nav').innerHTML = `
    <button data-act="go" data-view="list" aria-current="${v === 'list'}">Thú cưng</button>
    <button data-act="contact">Liên hệ nhận nuôi</button>
    ${IS_ADMIN ? `<button data-act="go" data-view="admin" aria-current="${v === 'admin'}">Quản trị</button>` : ''}`;
}
/* Admin is shown only to the artifact's owner, as reported by the Claude viewer.
   Outside Claude (e.g. the public Netlify site) nobody is admin. This only hides UI:
   the demo keeps all data in each visitor's own browser, so there is nothing shared to protect yet. */
let IS_ADMIN = false;
async function detectAdmin(){
  try {
    const user = window.claude?.use ? await window.claude.use('user') : null;
    if (user && await user.isOwner()){ IS_ADMIN = true; render(); }
  } catch(e) {}
}
function render(){
  if (S.view === 'admin' && !IS_ADMIN) S.view = 'list';
  save(); renderNav();
  (S.view === 'admin' ? viewAdmin : viewList)();
}

function filtered(){
  const f = S.filters;
  return PETS.filter(p =>
    (f.species === 'all' || p.species === f.species) && (f.breed === 'all' || p.breed === f.breed) && (f.sex === 'all' || p.sex === f.sex) &&
    (f.weight === 'all' || ({ s:p.weight < 5, m:p.weight >= 5 && p.weight < 10, l:p.weight >= 10 && p.weight < 20, xl:p.weight >= 20 })[f.weight])
  ).sort((a,b) => (petState(a.id) === 'adopted') - (petState(b.id) === 'adopted'));
}
function cardActions(p){
  return petState(p.id) === 'adopted'
    ? '<button class="btn small" disabled>Đã có nhà</button>'
    : `<button class="btn small add" data-act="detail" data-id="${p.id}" data-adopt>Nhận nuôi bé</button>`;
}
function viewList(){
  const f = S.filters, list = filtered();
  const breeds = [...new Set(PETS.filter(p => f.species === 'all' || p.species === f.species).map(p => p.breed))].sort((a,b)=>a.localeCompare(b,'vi'));
  const waiting = PETS.filter(p => petState(p.id) !== 'adopted').length;
  app.innerHTML = `
  <section class="hero">
    <div class="hero-text">
      <h1>Anh Chị tới, <em>thương bé cả đời!</em></h1>
      <p class="lead">TryYourPet là dự án phi lợi nhuận kết nối các trạm cứu hộ với cộng đồng nhằm tìm mái nhà phù hợp cho các bé chó, mèo trên khu vực TP.HCM thông qua hệ thống nhận nuôi.</p>
      <div class="hero-cta"><button class="btn add" data-act="scroll" data-to="pets">Xem ${waiting} bé đang chờ</button><button class="btn ghost on-band" data-act="scroll" data-to="contact">Liên hệ nhận nuôi</button></div>
    </div>
    <div class="hero-art" aria-hidden="true">
      <img class="bone" src="assets/bone.png" alt="">
      <svg class="burst" viewBox="0 0 100 100"><path d="M50 2 61 30 92 18 74 45 98 62 67 66 70 98 50 74 30 98 33 66 2 62 26 45 8 18 39 30Z" fill="#FA5A2C"/></svg>
      <img class="ball" src="assets/ball.png" alt="">
      <img class="m1" src="assets/dog-sit.png" alt="">
      <img class="m2" src="assets/cat-walk.png" alt="">
    </div>
  </section>
  <ol class="flow three" aria-label="Các bước nhận nuôi">
    <li><b>Chọn bé hợp với bạn</b>Xem hồ sơ, ảnh và video của từng bé</li>
    <li><b>Inbox hoặc gọi điện</b>Nhắn fanpage Purr Nature, Try Your Pet hoặc gọi ${CONTACT.phone.display}</li>
    <li><b>Hẹn ngày đón bé</b>Trạm trao đổi với bạn và hẹn ngày đón</li>
  </ol>
  <div class="filters" role="search" id="pets">
    <div class="field"><span>Loài</span>
      <div class="seg">${[['all','Tất cả'],['dog','Chó'],['cat','Mèo']].map(([k,l]) => `<button data-act="filter" data-k="species" data-v="${k}" aria-pressed="${f.species === k}">${l}</button>`).join('')}</div></div>
    <label class="field"><span>Giống</span><select id="f-breed" data-filter="breed"><option value="all">Tất cả giống</option>${breeds.map(b => `<option ${f.breed === b ? 'selected' : ''}>${esc(b)}</option>`).join('')}</select></label>
    <label class="field"><span>Giới tính</span><select id="f-sex" data-filter="sex">${[['all','Tất cả'],['Đực','Đực'],['Cái','Cái']].map(([k,l]) => `<option value="${k}" ${f.sex === k ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
    <label class="field"><span>Cân nặng</span><select id="f-weight" data-filter="weight">${[['all','Tất cả'],['s','Dưới 5 kg'],['m','5–10 kg'],['l','10–20 kg'],['xl','Trên 20 kg']].map(([k,l]) => `<option value="${k}" ${f.weight === k ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
    <span class="result-count">${list.length} bé phù hợp (bản demo có ${PETS.length} bé mẫu)</span>
  </div>
  ${list.length ? `<div class="grid">${list.map(p => {
    const st = petState(p.id);
    return `<article class="card">
      <button class="pic" data-act="detail" data-id="${p.id}" aria-label="Xem hồ sơ ${esc(p.name)}">${art(p)}${st !== 'available' ? `<span class="pill ${st}">${STATE_LABEL[st]}</span>` : ''}</button>
      <div class="body">
        <h3>${esc(p.name)}</h3>
        <p class="meta">${esc(p.breed)}, ${STATIONS[p.station].name}</p>
        <ul class="vitals" aria-label="Giới tính, tuổi, cân nặng"><li>${p.sex}</li><li>${ageText(p.age)}</li><li>${kg(p.weight)}</li></ul>
        <div class="tags"><span class="tag ${p.neutered ? 'yes' : ''}">${p.neutered ? 'Đã triệt sản' : 'Chưa triệt sản'}</span><span class="tag yes">${p.vaccine.split(' (')[0].split(',')[0]}</span></div>
        <div class="actions"><button class="btn small ghost" data-act="detail" data-id="${p.id}">Xem hồ sơ</button>${cardActions(p)}</div>
      </div></article>`; }).join('')}</div>`
  : `<div class="empty"><img class="mascot-empty" src="assets/dog-surprised.png" alt="">Chưa có bé nào khớp bộ lọc. <button class="btn small ghost" data-act="clearfilter">Xóa bộ lọc</button></div>`}
  <section class="panel contact-panel" id="contact">
    <h2>Liên hệ <em>nhận nuôi</em></h2>
    ${contactBlock(null)}
  </section>`;
}

let gallerySel = 0, openId = null;
function renderDetail(id, focusContact){
  const p = pet(id), st = petState(id), m = document.getElementById('modal');
  openId = id;
  const main = gallerySel < 3 ? art(p, gallerySel)
    : `<div class="video-big"><div><div class="play" aria-hidden="true">▶</div><b>Video ${esc(p.name)}, ${p.video}</b><p class="hint" style="color:inherit;opacity:.8">Bản chính thức phát video do trạm tải lên tại đây</p></div></div>`;
  m.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="Hồ sơ ${esc(p.name)}">
    <button class="x" data-act="close" aria-label="Đóng">×</button>
    <div class="gallery">
      <div class="gallery-main">${main}</div>
      <div class="thumbs">${[0,1,2].map(i => `<button class="thumb" data-act="gal" data-i="${i}" aria-pressed="${gallerySel === i}" aria-label="Ảnh ${i+1}">${art(p,i)}</button>`).join('')}
        <button class="thumb" data-act="gal" data-i="3" aria-pressed="${gallerySel === 3}" aria-label="Video"><div class="video-tile"><div><div class="play" aria-hidden="true">▶</div>${p.video}</div></div></button></div>
    </div>
    <div class="info">
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><h2>${esc(p.name)}</h2><span class="pill ${st}">${STATE_LABEL[st]}</span></div>
      <dl class="facts">
        <dt>Loài, giống</dt><dd>${species(p.species)}, ${esc(p.breed)}</dd>
        <dt>Giới tính</dt><dd>${p.sex}</dd>
        <dt>Tuổi</dt><dd>${ageText(p.age)}</dd>
        <dt>Cân nặng</dt><dd>${kg(p.weight)}</dd>
        <dt>Tiêm phòng</dt><dd>${esc(p.vaccine)}</dd>
        <dt>Triệt sản</dt><dd>${p.neutered ? 'Đã triệt sản' : 'Chưa triệt sản'}</dd>
        <dt>Trạm chăm sóc</dt><dd>${STATIONS[p.station].name}, ${STATIONS[p.station].area}${fbLink(STATIONS[p.station])}</dd>
      </dl>
      <div><p class="section-label">Tính cách</p><div class="tags" style="margin-top:6px">${p.traits.map(t => `<span class="tag yes">${esc(t)}</span>`).join('')}</div></div>
      <div><p class="section-label">Lịch sử cứu hộ</p><p class="story" style="margin-top:6px">${esc(p.story)}</p></div>
      ${st === 'adopted' ? `<p class="hint">${esc(p.name)} đã có nhà. Bạn xem các bé khác đang chờ nhé.</p>` : `<div id="adopt">${contactBlock(p)}</div>`}
    </div></div>`;
  m.hidden = false;
  if (focusContact) m.querySelector('#adopt')?.scrollIntoView({ block:'nearest' });
  else m.querySelector('.x').focus();
}

function viewAdmin(){
  const adopted = PETS.filter(p => petState(p.id) === 'adopted').length;
  app.innerHTML = `
  <div style="display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap">
    <div><h1>Quản trị</h1><p class="meta">Khách nhận nuôi qua inbox fanpage hoặc điện thoại. Ở đây quản trị viên cập nhật bé nào đã có nhà.</p></div>
    <span class="note">Bản demo, thay đổi chỉ lưu trên trình duyệt này</span>
  </div>
  <div class="kpis two-kpis">
    <div class="kpi"><b>${PETS.length - adopted}</b><span>Bé đang tìm nhà</span></div>
    <div class="kpi"><b>${adopted}</b><span>Bé đã có nhà</span></div>
  </div>
  <section class="panel"><h2>Các bé</h2><div class="scroll"><table><thead><tr><th>Bé</th><th>Trạm</th><th>Trạng thái</th><th></th></tr></thead><tbody>
    ${PETS.map(p => { const st = petState(p.id); return `<tr><td><b>${esc(p.name)}</b><br><small class="meta">${species(p.species)}, ${esc(p.breed)}</small></td><td>${STATIONS[p.station].name}</td>
      <td><span class="pill ${st}">${STATE_LABEL[st]}</span></td>
      <td><button class="btn small ${st === 'adopted' ? 'ghost' : ''}" data-act="toggleadopt" data-id="${p.id}">${st === 'adopted' ? 'Bỏ đánh dấu' : 'Đánh dấu đã có nhà'}</button></td></tr>`; }).join('')}
  </tbody></table></div></section>`;
}

/* ---------- events ---------- */
let toastT;
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2800); }
function closeModal(){ const m = document.getElementById('modal'); m.hidden = true; m.innerHTML = ''; openId = null; }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el){ if (e.target.id === 'modal') closeModal(); return; }
  const a = el.dataset.act, id = el.dataset.id;
  if (a === 'go'){ S.view = el.dataset.view; closeModal(); window.scrollTo(0,0); }
  else if (a === 'contact'){ if (S.view !== 'list'){ S.view = 'list'; render(); } document.getElementById('contact').scrollIntoView({ behavior:'smooth' }); return; }
  else if (a === 'scroll'){ document.getElementById(el.dataset.to)?.scrollIntoView({ behavior:'smooth' }); return; }
  else if (a === 'filter'){ S.filters[el.dataset.k] = el.dataset.v; if (el.dataset.k === 'species') S.filters.breed = 'all'; }
  else if (a === 'clearfilter'){ S.filters = { species:'all', breed:'all', sex:'all', weight:'all' }; }
  else if (a === 'detail'){ gallerySel = 0; renderDetail(id, 'adopt' in el.dataset); return; }
  else if (a === 'gal'){ gallerySel = +el.dataset.i; renderDetail(openId, false); return; }
  else if (a === 'close'){ closeModal(); return; }
  else if (a === 'toggleadopt'){ if (S.adopted[id]) delete S.adopted[id]; else S.adopted[id] = true; toast(pet(id).name + (S.adopted[id] ? ' đã được đánh dấu có nhà.' : ' đang tìm nhà trở lại.')); }
  else if (a === 'reset'){ S = seed(); closeModal(); toast('Đã đặt lại dữ liệu demo.'); }
  render();
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.filter){ S.filters[t.dataset.filter] = t.value; render(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !document.getElementById('modal').hidden) closeModal(); });
render();
detectAdmin();
</script>
